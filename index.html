<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nosso Amor</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- EFEITOS -->

    <div class="floating-hearts"></div>
    <div class="floating-stars"></div>

    <!-- TELA PRESENTE -->

    <section id="gift-screen">

        <div class="gift-container">

            <h2>Você recebeu um presente especial 🎁</h2>

            <p>Clique na caixa para abrir</p>

            <div class="gift-box" id="giftBox">

                <div class="gift-lid"></div>

                <div class="gift-body"></div>

            </div>

        </div>

    </section>

    <!-- CONTEÚDO PRINCIPAL -->

    <main id="main-content">

        <!-- SLIDESHOW -->

        <header class="slideshow-container">

            <div class="slide fade">
                <img src="imag/foto1.jpg">
            </div>

            <div class="slide fade">
                <img src="imag/foto2.jpg">
            </div>

            <div class="slide fade">
                <img src="imag/foto3.jpg">
            </div>

            <div class="overlay"></div>

            <div class="main-overlay">

                <span class="love-tag">
                    Nossa História ✨
                </span>

                <h1 class="modern-title">

                    <span>Phelipe</span>

                    <div class="heart-divider">❤</div>

                    <span>Vanessa</span>

                </h1>

                <p class="subtitle">
                    Cada segundo ao seu lado vale a eternidade
                </p>

            </div>

        </header>

        <!-- PLAYER -->

        <section class="music-section">

            <h2>Nossa Música 🎵</h2>

            <div class="music-player">

                <!-- TROQUE APENAS O ID -->

                <iframe
                    src="https://www.youtube.com/embed/TynFsTZlGDU?autoplay=1&loop=1&playlist=TynFsTZlGDU"
                    title="YouTube video player"
                    frameborder="0"
                    allow="autoplay"
                    allowfullscreen>
                </iframe>

            </div>

        </section>

        <!-- CONTADOR -->

        <section class="counter-section">

            <h2>Nosso Tempo Juntos ⏳</h2>

            <div id="timer">

                <div class="time-box">
                    <span id="days">00</span>
                    <label>Dias</label>
                </div>

                <div class="time-box">
                    <span id="hours">00</span>
                    <label>Horas</label>
                </div>

                <div class="time-box">
                    <span id="minutes">00</span>
                    <label>Minutos</label>
                </div>

                <div class="time-box">
                    <span id="seconds">00</span>
                    <label>Segundos</label>
                </div>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
